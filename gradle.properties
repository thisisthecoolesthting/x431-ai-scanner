org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dkotlin.incremental=false
# JDK 17 required by Android Gradle Plugin (adjust install path per workstation).
# Disabled: Kotlin in-process compiler + Room KSP can hit NoSuchFile on BuildConfig.java (Windows JDK 17).
kotlin.compiler.execution.strategy=out-of-process

# Windows: reduce flaky resource-merge concurrency under deep Documents/ paths.
org.gradle.parallel=false
org.gradle.workers.max=1

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

ksp.incremental=false
kotlin.incremental=false